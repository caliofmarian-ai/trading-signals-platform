plugins { id 'com.android.application' }

android {
    namespace 'com.caliof.tradingsignals'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.caliof.tradingsignals'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
