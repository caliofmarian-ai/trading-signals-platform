name: R017 hotfix followup

on:
  push:
    branches:
      - hotfix/r017-admin-delivery-failsafe

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/r017-admin-delivery-failsafe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Separate transport success from post-send persistence failure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('send/core/bot_service.py')
          text = path.read_text(encoding='utf-8')

          old = (
              '    try:\n'
              '        result = telegram_publisher.send_message(\n'
              '            chat_id=chat_id,\n'
              '            text=text,\n'
              '            reply_markup=reply_markup,\n'
              '            thread_id=thread_id,\n'
              '        )\n'
              '        trace_payload["selected_operation"] = "send_replacement"\n'
          )
          new = (
              '    transport_sent = False\n'
              '    try:\n'
              '        result = telegram_publisher.send_message(\n'
              '            chat_id=chat_id,\n'
              '            text=text,\n'
              '            reply_markup=reply_markup,\n'
              '            thread_id=thread_id,\n'
              '        )\n'
              '        transport_sent = True\n'
              '        trace_payload["selected_operation"] = "send_replacement"\n'
          )
          if old not in text:
              raise SystemExit('transport-success anchor not found')
          text = text.replace(old, new, 1)

          old = (
              '    except Exception as send_exc:\n'
              '        trace_payload["selected_operation"] = "send_replacement"\n'
          )
          new = (
              '    except Exception as send_exc:\n'
              '        # sendMessage may already have succeeded; persistence or trace\n'
              '        # failures after that point must never cause a duplicate send.\n'
              '        if transport_sent:\n'
              '            trace_payload["selected_operation"] = "send_completed_post_send_failure"\n'
              '            trace_payload["edit_result_category"] = "post_send_failure"\n'
              '            trace_payload["post_send_error"] = telegram_publisher._sanitize(str(send_exc))\n'
              '            observability_logger.log_error({\n'
              '                "event_type": "error",\n'
              '                "data": {\n'
              '                    "severity": "WARNING",\n'
              '                    "error_type": "telegram_app_nav_post_send_failure",\n'
              '                    "message": telegram_publisher._sanitize(str(send_exc)),\n'
              '                    "context": {\n'
              '                        "chat_id": chat_id,\n'
              '                        "user_id": user_id,\n'
              '                        "thread_id": thread_id,\n'
              '                    },\n'
              '                },\n'
              '            })\n'
              '            return\n\n'
              '        trace_payload["selected_operation"] = "send_replacement"\n'
          )
          if old not in text:
              raise SystemExit('send-exception anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile patched module
        run: python -m py_compile send/core/bot_service.py

      - name: Run focused and prior regression tests
        run: |
          python -m pytest -q \
            tests/canonical/unit/test_r017_admin_delivery_failsafe.py \
            tests/telegram_transport/test_telegram_transport_and_recovery.py \
            tests/canonical/unit/test_restart_redeploy_recovery.py

      - name: Run full repository regression suite
        run: python -m pytest -q

      - name: Commit followup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r017_hotfix_followup.yml
          git add send/core/bot_service.py
          git commit -m "fix: avoid duplicate send after persistence failure"
          git push origin HEAD:hotfix/r017-admin-delivery-failsafe
