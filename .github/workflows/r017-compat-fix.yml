name: R017 Callback Compatibility Reconciliation

on:
  push:
    branches:
      - remediation/audit-2026-09-01-r017-telegram-multi-role-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/audit-2026-09-01-r017-telegram-multi-role-acceptance
          fetch-depth: 0
      - name: Reconcile recovery and admin authorization boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path('send/core/bot_service.py')
          text = bot.read_text(encoding='utf-8')
          old = '''def _can_use_admin_callback(message: Dict[str, Any], user_id: int) -> bool:
              if _is_owner_private_context(message, user_id):
                  return True
              if not _is_admin_topic_context(message):
                  return False
              # Admin-topic location is only a context gate. Non-Owner actors must
              # also hold the governed admin.view permission (R-016/R-017).
              from core.admin_permissions import has_permission
              return has_permission(user_id, "admin.view")
          '''
          new = '''def _can_use_admin_callback(message: Dict[str, Any], user_id: int) -> bool:
              # This gate validates Telegram context only. Retired/unknown callback
              # recovery must remain reachable without exposing a live Admin surface.
              # Live ADMIN_NAV authorization is enforced in the navigation dispatcher.
              if _is_owner_private_context(message, user_id):
                  return True
              return _is_admin_topic_context(message)
          '''
          if old not in text:
              raise SystemExit('_can_use_admin_callback hardened block not found')
          text = text.replace(old, new, 1)

          old = '''def _handle_admin_navigation_action(action: str, user_id: int, message: Dict[str, Any]) -> Dict[str, Any]:
              owner_private = _is_owner_private_for_message(message, user_id)
              role = get_primary_role(user_id)

              # Button visibility is not authorization. A forged callback targeting a
          '''
          new = '''def _handle_admin_navigation_action(action: str, user_id: int, message: Dict[str, Any]) -> Dict[str, Any]:
              owner_private = _is_owner_private_for_message(message, user_id)
              role = get_primary_role(user_id)

              # Admin-topic membership is context, not authorization. Every live
              # non-Owner ADMIN_NAV action requires the governed admin.view grant.
              if not owner_private:
                  from core.admin_permissions import has_permission
                  if not has_permission(user_id, "admin.view"):
                      return {
                          "text": "Access denied (missing admin permission).",
                          "reply_markup": None,
                          _CALLBACK_RECOVERY_KEY: _RECOVERY_UNAUTHORIZED,
                      }

              # Button visibility is not authorization. A forged callback targeting a
          '''
          if old not in text:
              raise SystemExit('_handle_admin_navigation_action authorization insertion point not found')
          text = text.replace(old, new, 1)
          bot.write_text(text, encoding='utf-8')

          test = Path('tests/canonical/unit/test_telegram_runtime_remediation.py')
          text = test.read_text(encoding='utf-8')
          needle = '''    monkeypatch.setenv("OWNER_TELEGRAM_ID", "1001")
              monkeypatch.setenv("ADMIN_CONTROL_CHAT_ID", "-1001")
              monkeypatch.setenv("ADMIN_CONTROL_THREAD_ID", "999")
              bot = fresh_imports("core.bot_service")
              edits: list[dict] = []
          '''
          replacement = '''    monkeypatch.setenv("OWNER_TELEGRAM_ID", "1001")
              monkeypatch.setenv("ADMIN_CONTROL_CHAT_ID", "-1001")
              monkeypatch.setenv("ADMIN_CONTROL_THREAD_ID", "999")
              roles_path = canonical_runtime_root / "config" / "admin_roles.json"
              roles = json.loads(roles_path.read_text(encoding="utf-8"))
              primary = list(roles.get("primary_admin", []))
              if 2002 not in primary:
                  primary.append(2002)
              roles["primary_admin"] = primary
              roles_path.write_text(json.dumps(roles, indent=2), encoding="utf-8")
              monkeypatch.setenv("ADMIN_ROLES_CONFIG", str(roles_path))
              monkeypatch.setenv(
                  "ADMIN_PERMISSIONS_CONFIG",
                  str(canonical_runtime_root / "config" / "admin_permissions.json"),
              )
              bot = fresh_imports("core.bot_service")
              edits: list[dict] = []
          '''
          if needle not in text:
              raise SystemExit('reload confirmation test setup not found exactly')
          text = text.replace(needle, replacement, 1)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/r017-compat-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add send/core/bot_service.py tests/canonical/unit/test_telegram_runtime_remediation.py .github/workflows/r017-compat-fix.yml
          git commit -m "R-017: preserve callback recovery while enforcing live admin authorization"
          git push origin HEAD:remediation/audit-2026-09-01-r017-telegram-multi-role-acceptance
