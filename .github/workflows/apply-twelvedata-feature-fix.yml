name: Apply Twelve Data Feature Fix

on:
  push:
    branches:
      - feature/twelvedata-live-stream-foundation
    paths:
      - .github/workflows/apply-twelvedata-feature-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twelvedata-live-stream-foundation
      - name: Apply exact fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          market = Path('send/runtime/twelvedata_market_data.py')
          text = market.read_text(encoding='utf-8')
          old = '''        if (\n            not isinstance(payload, dict)\n            or payload.get("provider") != "TWELVE_DATA"\n            or normalize_symbol(payload.get("symbol")) != self.symbol\n        ):\n            self._store_load_state = "ERROR"\n            return\n'''
          new = '''        if not isinstance(payload, dict) or payload.get("provider") != "TWELVE_DATA":\n            self._store_load_state = "ERROR"\n            return\n        stored_symbol = payload.get("symbol")\n        try:\n            stored_symbol = normalize_symbol(stored_symbol)\n        except TwelveDataConfigurationError:\n            self._store_load_state = "ERROR"\n            return\n        if stored_symbol != self.symbol:\n            self._store_load_state = "ERROR"\n            return\n'''
          if text.count(old) != 1:
              raise SystemExit('expected twelvedata store block not found exactly once')
          market.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/canonical/unit/test_twelvedata_live_stream.py')
          text = test.read_text(encoding='utf-8')
          old = '''    feed.ingest_message(\n        {"event": "price", "symbol": "EUR/USD", "timestamp": now_ts + 1, "price": "1.1238"}\n    )\n\n    m1 = feed.get_candles("1min")[0]\n'''
          new = '''    feed.ingest_message(\n        {"event": "price", "symbol": "EUR/USD", "timestamp": now_ts, "price": "1.1238"}\n    )\n\n    m1 = feed.get_candles("1min")[0]\n'''
          if text.count(old) != 1:
              raise SystemExit('expected live tick test block not found exactly once')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate syntax
        run: PYTHONPATH=.:send python -m py_compile send/runtime/twelvedata_market_data.py send/runtime/market_client.py
      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add send/runtime/twelvedata_market_data.py tests/canonical/unit/test_twelvedata_live_stream.py
          git diff --cached --quiet && exit 1
          git commit -m "Fix Twelve Data feature validation [skip ci]"
          git push origin HEAD:feature/twelvedata-live-stream-foundation
