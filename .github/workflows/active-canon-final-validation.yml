name: Active Canon Final Validation

on:
  push:
    branches:
      - governance/active-canon-metadata-cleanup-20260901

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/active-canon-metadata-cleanup-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict final active canon validation
        id: validation
        shell: bash
        run: |
          set +e
          python scripts/_tmp_active_canon_final_validation.py > final-active-canon-validation.txt 2>&1
          rc=$?
          cat final-active-canon-validation.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: final-active-canon-validation
          path: final-active-canon-validation.txt
      - name: Enforce validation result
        run: |
          test "${{ steps.validation.outputs.exit_code }}" = "0"
