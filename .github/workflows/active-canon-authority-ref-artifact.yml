name: Active Canon Authority Ref Artifact

on:
  push:
    branches:
      - governance/active-canon-metadata-cleanup-20260901

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/active-canon-metadata-cleanup-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact current-authority findings
        run: python scripts/_tmp_active_canon_authority_ref_strict.py
      - uses: actions/upload-artifact@v4
        with:
          name: active-canon-authority-findings
          path: audit/active-canon-metadata-cleanup-20260901/AUTHORITY_REF_FINDINGS.md
