name: Apply Live Focus And Wide Scan Fix

on:
  push:
    branches:
      - feature/twelvedata-live-stream-foundation
    paths:
      - .github/workflows/apply-live-focus-wide-scan-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twelvedata-live-stream-foundation
      - name: Apply deterministic runtime changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          market = Path('send/runtime/market_client.py')
          text = market.read_text(encoding='utf-8')
          replacements = [
              ('_TWELVE_DATA_FEED = None\n', '_TWELVE_DATA_FEEDS = {}\n'),
              ('''def _twelve_data_stream_symbol() -> str:\n    value = os.getenv("TWELVE_DATA_STREAM_SYMBOL", "EUR/USD").strip().upper().replace("_", "/")\n    if not value or "/" not in value:\n        raise RuntimeError(f"Invalid TWELVE_DATA_STREAM_SYMBOL: {value!r}")\n    return value\n\n\n''', ''),
              ('''def _twelve_data_feed():\n    global _TWELVE_DATA_FEED\n    if _TWELVE_DATA_FEED is None:\n        from runtime.twelvedata_market_data import TwelveDataRealtimeFeed\n\n        _TWELVE_DATA_FEED = TwelveDataRealtimeFeed(\n            symbol=_twelve_data_stream_symbol(),\n            token=_api_key(),\n        )\n    return _TWELVE_DATA_FEED\n''', '''def _twelve_data_feed(symbol: str):\n    normalized = str(symbol).strip().upper().replace("_", "/")\n    feed = _TWELVE_DATA_FEEDS.get(normalized)\n    if feed is None:\n        from runtime.twelvedata_market_data import TwelveDataRealtimeFeed\n\n        feed = TwelveDataRealtimeFeed(symbol=normalized, token=_api_key())\n        _TWELVE_DATA_FEEDS[normalized] = feed\n    return feed\n'''),
              ('def get_candles(symbol: str, timeframe: str):\n', 'def get_candles(symbol: str, timeframe: str, *, prefer_live: bool = False):\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'market_client expected exactly one occurrence: {old[:80]!r}; found {text.count(old)}')
              text = text.replace(old, new)

          old = '''    requested_symbol = str(symbol).strip().upper().replace("_", "/")\n    use_live_stream = (\n        _twelve_data_streaming_enabled()\n        and requested_symbol == _twelve_data_stream_symbol()\n    )\n    if not use_live_stream:\n        return _cached_rest_candles(symbol, timeframe)\n'''
          new = '''    requested_symbol = str(symbol).strip().upper().replace("_", "/")\n    if not (_twelve_data_streaming_enabled() and prefer_live):\n        return _cached_rest_candles(symbol, timeframe)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'live selection block count={text.count(old)}')
          text = text.replace(old, new)
          if text.count('    feed = _twelve_data_feed()\n') != 1:
              raise SystemExit('feed call mismatch')
          text = text.replace('    feed = _twelve_data_feed()\n', '    feed = _twelve_data_feed(symbol)\n')

          old = '''    except TwelveDataStreamingUnavailable as exc:\n        candles = _cached_rest_candles(symbol, timeframe)\n        runtime_status.update_status(\n            market_data_state="READY",\n            market_data_note=(\n                "Twelve Data WebSocket unavailable; bounded REST cache fallback active: "\n                f"{exc}"\n            ),\n            market_data_provider="TWELVE_DATA",\n            market_data_symbol=requested_symbol,\n            market_data_history_ready=True,\n            market_data_stream_state="REST_FALLBACK",\n        )\n        return candles\n'''
          new = '''    except TwelveDataStreamingUnavailable as exc:\n        runtime_status.update_status(\n            market_data_state="MARKET_DATA_UNAVAILABLE",\n            market_data_note=(\n                "Twelve Data live stream unavailable for focus symbol; "\n                "actionable evaluation is fail-closed: " + str(exc)\n            ),\n            market_data_provider="TWELVE_DATA",\n            market_data_symbol=requested_symbol,\n            market_data_history_ready=False,\n            market_data_stream_state="UNAVAILABLE",\n        )\n        raise MarketDataUnavailableError(str(exc)) from exc\n'''
          if text.count(old) != 1:
              raise SystemExit(f'stream fallback block count={text.count(old)}')
          market.write_text(text.replace(old, new), encoding='utf-8')

          engine = Path('send/core/signal_engine.py')
          text = engine.read_text(encoding='utf-8')
          marker = 'EVENT_SCHEMA_VERSION = "3.0.0"\n\n\n'
          helper = '''EVENT_SCHEMA_VERSION = "3.0.0"\nWIDE_SCAN_SLOT_SECONDS = 2\nWIDE_SCAN_CYCLE_SECONDS = 60\n\n\ndef _select_scan_symbols(symbols: List[str], watchlist: List[str], now_ts: int) -> tuple[List[str], set[str]]:\n    """Prioritize focus every tick while preserving bounded wide-scan coverage.\n\n    Wide symbols are deterministically spread across the M1 decision cycle so\n    the same opportunity is not fully re-evaluated every 2-second engine tick.\n    """\n\n    active_set = set(symbols)\n    focus = [symbol for symbol in watchlist if symbol in active_set]\n    focus_set = set(focus)\n    wide = [symbol for symbol in symbols if symbol not in focus_set]\n    slots = max(1, WIDE_SCAN_CYCLE_SECONDS // WIDE_SCAN_SLOT_SECONDS)\n    current_slot = (int(now_ts) % WIDE_SCAN_CYCLE_SECONDS) // WIDE_SCAN_SLOT_SECONDS\n    selected_wide = [\n        symbol for index, symbol in enumerate(wide) if index % slots == current_slot\n    ]\n    return focus + selected_wide, focus_set\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('signal_engine version marker mismatch')
          text = text.replace(marker, helper)
          old = '''    watchlist = state.get("watchlist", []) if isinstance(state, dict) else []\n    natural_in_focus = isinstance(watchlist, list) and len(watchlist) > 0\n\n    if forced_symbols is not None:\n        scan_symbols = [str(x).strip() for x in forced_symbols if str(x).strip()]\n        effective_in_focus = bool(forced_focus_context)\n    else:\n        scan_symbols = watchlist if natural_in_focus else symbols\n        effective_in_focus = bool(natural_in_focus)\n'''
          new = '''    watchlist = state.get("watchlist", []) if isinstance(state, dict) else []\n    if not isinstance(watchlist, list):\n        watchlist = []\n\n    if forced_symbols is not None:\n        scan_symbols = [str(x).strip() for x in forced_symbols if str(x).strip()]\n        focus_symbols = set(scan_symbols) if bool(forced_focus_context) else set()\n    else:\n        scan_symbols, focus_symbols = _select_scan_symbols(symbols, watchlist, now_ts)\n'''
          if text.count(old) != 1:
              raise SystemExit('signal_engine scan selection block mismatch')
          text = text.replace(old, new)
          old = '''            raw_m1 = get_candles(symbol, "1min")\n            raw_m5 = get_candles(symbol, "5min")\n'''
          new = '''            symbol_in_focus = symbol in focus_symbols\n            raw_m1 = get_candles(symbol, "1min", prefer_live=symbol_in_focus)\n            raw_m5 = get_candles(symbol, "5min", prefer_live=symbol_in_focus)\n'''
          if text.count(old) != 1:
              raise SystemExit('signal_engine candle fetch block mismatch')
          text = text.replace(old, new)
          if text.count('want_open_now=bool(effective_in_focus),') != 1:
              raise SystemExit('signal_engine want_open_now marker mismatch')
          text = text.replace('want_open_now=bool(effective_in_focus),', 'want_open_now=bool(symbol_in_focus),')
          engine.write_text(text, encoding='utf-8')

          for path in [
              Path('tests/batch_06/test_fsm_restart_recovery.py'),
              Path('tests/canonical/unit/test_binary_strategy_v2_runtime.py'),
              Path('tests/canonical/unit/test_signal_engine_persistence_boundary_v3.py'),
          ]:
              t = path.read_text(encoding='utf-8')
              t = t.replace('lambda symbol, timeframe:', 'lambda symbol, timeframe, **kwargs:')
              t = t.replace('lambda symbol, interval:', 'lambda symbol, interval, **kwargs:')
              t = t.replace('def get_candles(symbol, timeframe):', 'def get_candles(symbol, timeframe, **kwargs):')
              path.write_text(t, encoding='utf-8')
          PY
      - name: Add scheduling tests
        shell: bash
        run: |
          cat > tests/canonical/unit/test_signal_engine_wide_focus_scheduling_v3.py <<'PY'
          from core.signal_engine import _select_scan_symbols


          def test_focus_is_scanned_every_tick_and_wide_is_not_starved():
              symbols = [f"S{i}" for i in range(27)]
              watchlist = ["S0", "S1"]
              seen_wide = set()
              for now_ts in range(0, 60, 2):
                  selected, focus = _select_scan_symbols(symbols, watchlist, now_ts)
                  assert selected[:2] == watchlist
                  assert focus == {"S0", "S1"}
                  seen_wide.update(symbol for symbol in selected if symbol not in focus)
              assert seen_wide == set(symbols[2:])


          def test_no_focus_spreads_full_universe_across_one_m1_cycle():
              symbols = [f"S{i}" for i in range(27)]
              seen = []
              for now_ts in range(0, 60, 2):
                  selected, focus = _select_scan_symbols(symbols, [], now_ts)
                  assert focus == set()
                  seen.extend(selected)
              assert set(seen) == set(symbols)
              assert len(seen) == len(symbols)


          def test_focus_membership_is_per_symbol_not_global():
              selected, focus = _select_scan_symbols(["EUR/USD", "GBP/USD", "USD/JPY"], ["GBP/USD"], 0)
              assert "GBP/USD" in selected
              assert "GBP/USD" in focus
              assert "EUR/USD" not in focus
          PY
      - name: Compile
        run: PYTHONPATH=.:send python -m py_compile send/core/signal_engine.py send/runtime/market_client.py send/runtime/twelvedata_market_data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add send/core/signal_engine.py send/runtime/market_client.py tests/batch_06/test_fsm_restart_recovery.py tests/canonical/unit/test_binary_strategy_v2_runtime.py tests/canonical/unit/test_signal_engine_persistence_boundary_v3.py tests/canonical/unit/test_signal_engine_wide_focus_scheduling_v3.py
          git diff --cached --quiet && exit 1
          git commit -m "Prioritize live focus while preserving wide scan [skip ci]"
          git push origin HEAD:feature/twelvedata-live-stream-foundation
