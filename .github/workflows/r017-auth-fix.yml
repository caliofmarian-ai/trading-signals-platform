name: R017 Telegram Authorization Hardening

on:
  push:
    branches:
      - remediation/audit-2026-09-01-r017-telegram-multi-role-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/audit-2026-09-01-r017-telegram-multi-role-acceptance
          fetch-depth: 0
      - name: Apply fail-closed callback and panel authorization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('send/core/telegram_admin_ui.py')
          text = ui.read_text(encoding='utf-8')
          old = '''def panel_visible_for_role(role: str, panel_action: str) -> bool:
              allowed = _PANEL_VISIBILITY.get(role, frozenset())
              return str(panel_action or "").strip().upper() in allowed
          '''
          new = '''def panel_visible_for_role(role: str, panel_action: str) -> bool:
              allowed = _PANEL_VISIBILITY.get(role, frozenset())
              return str(panel_action or "").strip().upper() in allowed


          def is_canonical_panel_action(panel_action: str) -> bool:
              return str(panel_action or "").strip().upper() in _ALL_PANEL_KEYS
          '''
          if old not in text:
              raise SystemExit('panel_visible_for_role block not found')
          text = text.replace(old, new, 1)
          old = '''    allowed = _PANEL_VISIBILITY.get(role, _ALL_PANEL_KEYS)
              visible = [(key, label) for key, label in _CANONICAL_PANELS if key in allowed]
          '''
          new = '''    # Backward compatibility is retained only for legacy callers that omit role.
              # An explicit unknown/USER role is unauthorized and must not inherit all panels.
              allowed = _ALL_PANEL_KEYS if not role else _PANEL_VISIBILITY.get(role, frozenset())
              visible = [(key, label) for key, label in _CANONICAL_PANELS if key in allowed]
          '''
          if old not in text:
              raise SystemExit('admin_home_markup allowed block not found')
          text = text.replace(old, new, 1)
          ui.write_text(text, encoding='utf-8')

          bot = Path('send/core/bot_service.py')
          text = bot.read_text(encoding='utf-8')
          old = '''def _can_use_admin_callback(message: Dict[str, Any], user_id: int) -> bool:
              if _is_owner_private_context(message, user_id):
                  return True
              return _is_admin_topic_context(message)
          '''
          new = '''def _can_use_admin_callback(message: Dict[str, Any], user_id: int) -> bool:
              if _is_owner_private_context(message, user_id):
                  return True
              if not _is_admin_topic_context(message):
                  return False
              # Admin-topic location is only a context gate. Non-Owner actors must
              # also hold the governed admin.view permission (R-016/R-017).
              from core.admin_permissions import has_permission
              return has_permission(user_id, "admin.view")
          '''
          if old not in text:
              raise SystemExit('_can_use_admin_callback block not found')
          text = text.replace(old, new, 1)
          old = '''def _handle_admin_navigation_action(action: str, user_id: int, message: Dict[str, Any]) -> Dict[str, Any]:
              owner_private = _is_owner_private_for_message(message, user_id)

              # ---- BACK: navigate to canonical immediate parent ----
          '''
          new = '''def _handle_admin_navigation_action(action: str, user_id: int, message: Dict[str, Any]) -> Dict[str, Any]:
              owner_private = _is_owner_private_for_message(message, user_id)
              role = get_primary_role(user_id)

              # Button visibility is not authorization. A forged callback targeting a
              # canonical top-level panel must pass the same role visibility boundary.
              if (
                  telegram_admin_ui.is_canonical_panel_action(action)
                  and not telegram_admin_ui.panel_visible_for_role(role, action)
              ):
                  return {
                      "text": "Access denied (missing panel permission).",
                      "reply_markup": None,
                      _CALLBACK_RECOVERY_KEY: _RECOVERY_UNAUTHORIZED,
                  }

              # ---- BACK: navigate to canonical immediate parent ----
          '''
          if old not in text:
              raise SystemExit('_handle_admin_navigation_action header not found')
          text = text.replace(old, new, 1)
          bot.write_text(text, encoding='utf-8')

          test = Path('tests/telegram_app/test_r017_multi_role_journeys.py')
          text = test.read_text(encoding='utf-8')
          old = '''            if value.startswith("ADMIN_NAV:"):
                          callbacks.add(value.split(":", 1)[1])
          '''
          new = '''            if value.startswith("ADMIN_NAV:"):
                          action = value.split(":", 1)[1]
                          if not action.startswith("INFO:"):
                              callbacks.add(action)
          '''
          if old not in text:
              raise SystemExit('R017 panel callback helper block not found')
          text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/r017-auth-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add send/core/telegram_admin_ui.py send/core/bot_service.py tests/telegram_app/test_r017_multi_role_journeys.py .github/workflows/r017-auth-fix.yml
          git commit -m "R-017: fail closed on forged admin panel callbacks"
          git push origin HEAD:remediation/audit-2026-09-01-r017-telegram-multi-role-acceptance
