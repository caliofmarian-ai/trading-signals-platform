name: Align Live Focus Tests

on:
  push:
    branches:
      - feature/twelvedata-live-stream-foundation
    paths:
      - .github/workflows/align-live-focus-tests.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twelvedata-live-stream-foundation
      - name: Align tests with fail-closed live focus contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/canonical/unit/test_twelvedata_live_stream.py')
          text = path.read_text(encoding='utf-8')

          if text.count('market._TWELVE_DATA_FEED = _Feed()') != 2:
              raise SystemExit('expected two legacy single-feed assignments')
          text = text.replace('market._TWELVE_DATA_FEED = _Feed()', 'market._TWELVE_DATA_FEEDS = {"EUR/USD": _Feed()}')

          old = '''    candles = market.get_candles("EUR/USD", "1min")\n    assert candles[0]["symbol"] == "EUR/USD"\n'''
          new = '''    candles = market.get_candles("EUR/USD", "1min", prefer_live=True)\n    assert candles[0]["symbol"] == "EUR/USD"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'live stream call block count={text.count(old)}')
          text = text.replace(old, new)

          old = '''def test_stream_subscription_failure_falls_back_to_bounded_rest_cache(\n    canonical_runtime_root, fresh_imports, monkeypatch\n):\n    monkeypatch.setenv("MARKET_DATA_PROVIDER", "TWELVE_DATA")\n    monkeypatch.setenv("TWELVE_DATA_STREAMING_ENABLED", "1")\n    monkeypatch.setenv("TWELVE_DATA_STREAM_SYMBOL", "EUR/USD")\n    market = fresh_imports("runtime.market_client")\n    td = importlib.import_module("runtime.twelvedata_market_data")\n\n    class _Feed:\n        def get_candles(self, timeframe):\n            raise td.TwelveDataStreamingUnavailable("trial subscription unavailable")\n\n    market._TWELVE_DATA_FEEDS = {"EUR/USD": _Feed()}\n    fallback = [{"symbol": "EUR/USD", "timeframe": "1min", "ts": 321}]\n    monkeypatch.setattr(market, "_cached_rest_candles", lambda symbol, timeframe: fallback)\n\n    assert market.get_candles("EUR/USD", "1min") == fallback\n    status = importlib.import_module("runtime.runtime_status").read_status()\n    assert status["market_data_state"] == "READY"\n    assert status["market_data_stream_state"] == "REST_FALLBACK"'''
          new = '''def test_focus_stream_subscription_failure_is_fail_closed_while_wide_can_use_cache(\n    canonical_runtime_root, fresh_imports, monkeypatch\n):\n    monkeypatch.setenv("MARKET_DATA_PROVIDER", "TWELVE_DATA")\n    monkeypatch.setenv("TWELVE_DATA_STREAMING_ENABLED", "1")\n    market = fresh_imports("runtime.market_client")\n    td = importlib.import_module("runtime.twelvedata_market_data")\n\n    class _Feed:\n        def get_candles(self, timeframe):\n            raise td.TwelveDataStreamingUnavailable("trial subscription unavailable")\n\n    market._TWELVE_DATA_FEEDS = {"EUR/USD": _Feed()}\n    fallback = [{"symbol": "EUR/USD", "timeframe": "1min", "ts": 321}]\n    monkeypatch.setattr(market, "_cached_rest_candles", lambda symbol, timeframe: fallback)\n\n    assert market.get_candles("EUR/USD", "1min") == fallback\n    with pytest.raises(market.MarketDataUnavailableError, match="trial subscription unavailable"):\n        market.get_candles("EUR/USD", "1min", prefer_live=True)\n    status = importlib.import_module("runtime.runtime_status").read_status()\n    assert status["market_data_state"] == "MARKET_DATA_UNAVAILABLE"\n    assert status["market_data_stream_state"] == "UNAVAILABLE"'''
          if text.count(old) != 1:
              raise SystemExit(f'legacy fallback test count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/canonical/unit/test_twelvedata_live_stream.py
          git diff --cached --quiet && exit 1
          git commit -m "Align Twelve Data tests with live focus contract [skip ci]"
          git push origin HEAD:feature/twelvedata-live-stream-foundation
