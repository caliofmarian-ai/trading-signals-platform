name: Twelve Data Feature CI

on:
  push:
    branches:
      - feature/twelvedata-live-stream-foundation

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twelvedata-live-stream-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Syntax check
        run: PYTHONPATH=send python -m py_compile send/runtime/twelvedata_market_data.py send/runtime/market_client.py
      - name: Capture focused canonical tests
        run: |
          PYTHONPATH=send pytest -q tests/canonical/unit/test_twelvedata_live_stream.py tests/canonical/unit/test_finnhub_market_data_foundation.py tests/canonical/unit/test_telegram_runtime_remediation.py tests/canonical/integration/test_live_distribution_v3.py > focused-test-output.txt 2>&1 || true
      - name: Upload focused test output
        uses: actions/upload-artifact@v4
        with:
          name: twelvedata-focused-test-output
          path: focused-test-output.txt
