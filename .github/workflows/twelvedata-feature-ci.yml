name: Twelve Data Feature CI

on:
  push:
    branches:
      - feature/twelvedata-live-stream-foundation

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twelvedata-live-stream-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Syntax check
        run: |
          PYTHONPATH=send python -m py_compile send/runtime/twelvedata_market_data.py send/runtime/market_client.py
      - name: Focused canonical tests
        id: focused
        shell: bash
        run: |
          set +e
          PYTHONPATH=send pytest -q \
            tests/canonical/unit/test_twelvedata_live_stream.py \
            tests/canonical/unit/test_finnhub_market_data_foundation.py \
            tests/canonical/unit/test_telegram_runtime_remediation.py \
            tests/canonical/integration/test_live_distribution_v3.py 2>&1 | tee focused-test-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twelvedata-focused-test-output
          path: focused-test-output.txt
      - name: Enforce focused test result
        if: always()
        run: test "${{ steps.focused.outputs.exit_code }}" = "0"
