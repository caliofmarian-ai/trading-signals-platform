name: R017 hotfix apply

on:
  push:
    branches:
      - hotfix/r017-admin-delivery-failsafe

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/r017-admin-delivery-failsafe
          fetch-depth: 0

      - name: Apply targeted R-017 hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('send/core/bot_service.py')
          text = path.read_text(encoding='utf-8')

          old = '''    response_text = handle_admin_command_v2(cmd, user_id)\n    title_map = {\n'''
          new = '''    response_text = handle_admin_command_v2(cmd, user_id)\n    # File-producing slash commands use a transport marker consumed by\n    # process_update().  Preserve it verbatim; wrapping it in a human-\n    # comprehension surface makes the marker undiscoverable and leaks the\n    # temporary path into Telegram as plain text instead of sending the file.\n    if response_text.startswith("__FILE_PATH__:"):\n        return response_text, None\n\n    title_map = {\n'''
          if old not in text:
              raise SystemExit('render-panel anchor not found')
          text = text.replace(old, new, 1)

          old = '''    except Exception as send_exc:\n        trace_payload["selected_operation"] = "send_replacement"\n        trace_payload["edit_result_category"] = "send_failed"\n        trace_payload["send_error"] = str(send_exc)\n        _emit_interactive_trace(trace_payload, critical=True)\n        observability_logger.log_error({\n            "event_type": "error",\n            "data": {\n                "severity": "ERROR",\n                "error_type": "telegram_app_nav_send_failure",\n                "message": str(send_exc),\n                "context": {\n                    "chat_id": chat_id,\n                    "user_id": user_id,\n                    "thread_id": thread_id,\n                    "session_key_fingerprint": trace_payload.get("session_key_fingerprint"),\n                },\n            },\n        })\n'''
          new = '''    except Exception as send_exc:\n        trace_payload["selected_operation"] = "send_replacement"\n        trace_payload["edit_result_category"] = "send_failed"\n        trace_payload["send_error"] = telegram_publisher._sanitize(str(send_exc))\n        _emit_interactive_trace(trace_payload, critical=True)\n        observability_logger.log_error({\n            "event_type": "error",\n            "data": {\n                "severity": "ERROR",\n                "error_type": "telegram_app_nav_send_failure",\n                "message": telegram_publisher._sanitize(str(send_exc)),\n                "context": {\n                    "chat_id": chat_id,\n                    "user_id": user_id,\n                    "thread_id": thread_id,\n                    "session_key_fingerprint": trace_payload.get("session_key_fingerprint"),\n                },\n            },\n        })\n\n        # A keyboard/payload rejection must not look like a dead bot.  Retry\n        # exactly once with a short, text-only degraded response.  This does\n        # not bypass authorization or count as successful Admin acceptance; it\n        # merely makes the transport failure visible and diagnosable.\n        try:\n            fallback_result = telegram_publisher.send_message(\n                chat_id=chat_id,\n                text=(\n                    "Telegram request reached the runtime, but the interactive "\n                    "response could not be rendered. The failure was logged."\n                ),\n                reply_markup=None,\n                thread_id=thread_id,\n            )\n            trace_payload["selected_operation"] = "send_text_fallback"\n            trace_payload["text_fallback_result"] = "sent"\n            if isinstance(fallback_result, dict):\n                fallback_message = fallback_result.get("result") or {}\n                fallback_message_id = fallback_message.get("message_id")\n                if fallback_message_id:\n                    telegram_app_nav.set_active_message(\n                        user_id=user_id,\n                        chat_id=chat_id,\n                        message_id=fallback_message_id,\n                        thread_id=thread_id,\n                    )\n            _emit_interactive_trace(trace_payload, critical=True)\n        except Exception as fallback_exc:\n            observability_logger.log_error({\n                "event_type": "error",\n                "data": {\n                    "severity": "ERROR",\n                    "error_type": "telegram_app_nav_text_fallback_failure",\n                    "message": telegram_publisher._sanitize(str(fallback_exc)),\n                    "context": {\n                        "chat_id": chat_id,\n                        "user_id": user_id,\n                        "thread_id": thread_id,\n                    },\n                },\n            })\n'''
          if old not in text:
              raise SystemExit('send-failure anchor not found')
          text = text.replace(old, new, 1)

          old = '''    except Exception as e:\n        observability_logger.log_error({\n            "event_type": "error",\n            "data": {\n                "severity": "ERROR",\n                "error_type": "bot_service_exception",\n                "message": str(e),\n            },\n        })\n'''
          new = '''    except Exception as e:\n        observability_logger.log_error({\n            "event_type": "error",\n            "data": {\n                "severity": "ERROR",\n                "error_type": "bot_service_exception",\n                "message": telegram_publisher._sanitize(str(e)),\n            },\n        })\n\n        # Do not let an authorized Admin command disappear silently because a\n        # renderer/navigation exception occurred before the normal transport\n        # path.  Re-check context fail-closed and send only a sanitized,\n        # non-sensitive fallback.  Wrong-chat/unauthorized contexts receive no\n        # new privilege and continue through the normal denial path.\n        try:\n            failed_cmd = (\n                text.split()[0].split("@", 1)[0].lower()\n                if isinstance(text, str) and text.startswith("/")\n                else ""\n            )\n            if (\n                msg\n                and failed_cmd in admin_command_names()\n                and _can_run_admin_command(msg, user_id, failed_cmd)\n            ):\n                target = reply_target_from_message(msg)\n                if target is not None:\n                    telegram_publisher.send_message(\n                        chat_id=target.chat_id,\n                        text=(\n                            "Admin request reached the runtime but could not be "\n                            "completed safely. The failure was logged."\n                        ),\n                        reply_markup=None,\n                        thread_id=target.thread_id,\n                    )\n        except Exception as fallback_exc:\n            observability_logger.log_error({\n                "event_type": "error",\n                "data": {\n                    "severity": "ERROR",\n                    "error_type": "bot_service_exception_fallback_failed",\n                    "message": telegram_publisher._sanitize(str(fallback_exc)),\n                },\n            })\n'''
          if old not in text:
              raise SystemExit('global-exception anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/canonical/unit/test_r017_admin_delivery_failsafe.py')
          test_path.write_text(r'''from __future__ import annotations

import importlib
import os
import sys

import pytest


SEND_ROOT = os.path.abspath(os.path.join(os.path.dirname(__file__), "../../../send"))
if SEND_ROOT not in sys.path:
    sys.path.insert(0, SEND_ROOT)


@pytest.fixture
def bot(monkeypatch, tmp_path):
    monkeypatch.setenv("BINARYBOT_BASE_DIR", str(tmp_path))
    monkeypatch.setenv("OBS_DIR", str(tmp_path / "observability"))
    monkeypatch.setenv("ADMIN_CONTROL_CHAT_ID", "-1003726714813")
    monkeypatch.setenv("ADMIN_CONTROL_THREAD_ID", "1310")
    import core.bot_service as module
    return importlib.reload(module)


def test_file_transport_marker_is_not_wrapped(bot, monkeypatch):
    monkeypatch.setattr(
        bot,
        "handle_admin_command_v2",
        lambda cmd, user_id: "__FILE_PATH__:/tmp/binarybot_audit_test.json",
    )

    text, markup = bot._render_panel_for_command(
        "/audit_runtime", 7553887987, owner_private=True
    )

    assert text == "__FILE_PATH__:/tmp/binarybot_audit_test.json"
    assert markup is None
    assert "Runtime Audit" not in text


def test_interactive_send_failure_retries_once_as_text_only(bot, monkeypatch):
    calls = []

    monkeypatch.setattr(
        bot.telegram_app_nav,
        "get_runtime_diagnostics",
        lambda **kwargs: {
            "session_key_fingerprint": "abc",
            "active_message_id": None,
            "persisted_message_id": None,
            "resolved_state_path": "/data/state/telegram_ui_state.json",
            "save_result": {},
            "load_result": {},
            "pid": 1,
            "deployment_id": "test",
        },
    )
    monkeypatch.setattr(bot.telegram_app_nav, "get_active_message", lambda **kwargs: None)
    monkeypatch.setattr(bot.telegram_app_nav, "set_active_message", lambda **kwargs: None)
    monkeypatch.setattr(bot, "_emit_interactive_trace", lambda *args, **kwargs: None)
    monkeypatch.setattr(bot.observability_logger, "log_error", lambda payload: None)

    def fake_send_message(*, chat_id, text, reply_markup=None, thread_id=None):
        calls.append({"chat_id": chat_id, "text": text, "reply_markup": reply_markup, "thread_id": thread_id})
        if len(calls) == 1:
            raise RuntimeError("Bad Request: BUTTON_DATA_INVALID")
        return {"ok": True, "result": {"message_id": 77}}

    monkeypatch.setattr(bot.telegram_publisher, "send_message", fake_send_message)

    message = {
        "chat": {"id": -1003726714813, "type": "supergroup"},
        "message_thread_id": 1310,
    }
    bot._send_interactive_page(
        message,
        6766367444,
        "Admin page",
        {"inline_keyboard": [[{"text": "x", "callback_data": "ADMIN_NAV:HOME"}]]},
    )

    assert len(calls) == 2
    assert calls[0]["reply_markup"] is not None
    assert calls[1]["reply_markup"] is None
    assert "failure was logged" in calls[1]["text"]
    assert calls[1]["thread_id"] == 1310


def test_authorized_admin_renderer_exception_gets_sanitized_fallback(bot, monkeypatch):
    sent = []
    logged = []

    monkeypatch.setattr(bot, "admin_command_names", lambda: {"/admin"})
    monkeypatch.setattr(bot, "_can_run_admin_command", lambda message, user_id, cmd: True)
    monkeypatch.setattr(bot.telegram_app_nav, "record_app_navigation", lambda **kwargs: (_ for _ in ()).throw(RuntimeError("SECRET_INTERNAL_DETAIL")))
    monkeypatch.setattr(bot.observability_logger, "log_error", lambda payload: logged.append(payload))

    def fake_send_message(*, chat_id, text, reply_markup=None, thread_id=None):
        sent.append({"chat_id": chat_id, "text": text, "reply_markup": reply_markup, "thread_id": thread_id})
        return {"ok": True, "result": {"message_id": 88}}

    monkeypatch.setattr(bot.telegram_publisher, "send_message", fake_send_message)

    update = {
        "update_id": 1,
        "message": {
            "chat": {"id": -1003726714813, "type": "supergroup"},
            "from": {"id": 6766367444, "first_name": "Primary"},
            "text": "/admin",
            "message_id": 500,
            "message_thread_id": 1310,
        },
    }
    bot.process_update(update)

    assert logged
    assert sent
    assert sent[-1]["thread_id"] == 1310
    assert "could not be completed safely" in sent[-1]["text"]
    assert "SECRET_INTERNAL_DETAIL" not in sent[-1]["text"]


def test_wrong_chat_remains_fail_closed(bot, monkeypatch):
    replies = []
    monkeypatch.setattr(bot, "admin_command_names", lambda: {"/admin"})
    monkeypatch.setattr(bot, "_can_run_admin_command", lambda message, user_id, cmd: False)
    monkeypatch.setattr(
        bot,
        "_send_interactive_page",
        lambda message, user_id, text, reply_markup, **kwargs: replies.append(text),
    )

    bot.process_update({
        "update_id": 2,
        "message": {
            "chat": {"id": -1009999999999, "type": "supergroup"},
            "from": {"id": 6766367444},
            "text": "/admin",
            "message_id": 501,
            "message_thread_id": 999,
        },
    })

    assert replies == ["Access denied (wrong chat)."]
''', encoding='utf-8')
          PY

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/canonical/unit/test_r017_admin_delivery_failsafe.py \
            tests/telegram_transport/test_telegram_transport_and_recovery.py

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r017_hotfix_apply.yml
          git add send/core/bot_service.py tests/canonical/unit/test_r017_admin_delivery_failsafe.py
          git commit -m "fix: make R-017 admin delivery fail-safe"
          git push origin HEAD:hotfix/r017-admin-delivery-failsafe
