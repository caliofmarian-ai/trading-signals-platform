name: R017 hotfix apply

on:
  push:
    branches:
      - hotfix/r017-admin-delivery-failsafe

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/r017-admin-delivery-failsafe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Apply targeted bot-service patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('send/core/bot_service.py')
          text = path.read_text(encoding='utf-8')

          old = (
              '    response_text = handle_admin_command_v2(cmd, user_id)\n'
              '    title_map = {\n'
          )
          new = (
              '    response_text = handle_admin_command_v2(cmd, user_id)\n'
              '    # Preserve file-transport markers for the caller. Wrapping them in a\n'
              '    # human-comprehension surface leaks the temp path and prevents delivery.\n'
              '    if response_text.startswith("__FILE_PATH__:"):\n'
              '        return response_text, None\n\n'
              '    title_map = {\n'
          )
          if old not in text:
              raise SystemExit('render-panel anchor not found')
          text = text.replace(old, new, 1)

          old = (
              '    except Exception as send_exc:\n'
              '        trace_payload["selected_operation"] = "send_replacement"\n'
              '        trace_payload["edit_result_category"] = "send_failed"\n'
              '        trace_payload["send_error"] = str(send_exc)\n'
              '        _emit_interactive_trace(trace_payload, critical=True)\n'
              '        observability_logger.log_error({\n'
              '            "event_type": "error",\n'
              '            "data": {\n'
              '                "severity": "ERROR",\n'
              '                "error_type": "telegram_app_nav_send_failure",\n'
              '                "message": str(send_exc),\n'
              '                "context": {\n'
              '                    "chat_id": chat_id,\n'
              '                    "user_id": user_id,\n'
              '                    "thread_id": thread_id,\n'
              '                    "session_key_fingerprint": trace_payload.get("session_key_fingerprint"),\n'
              '                },\n'
              '            },\n'
              '        })\n'
          )
          new = (
              '    except Exception as send_exc:\n'
              '        trace_payload["selected_operation"] = "send_replacement"\n'
              '        trace_payload["edit_result_category"] = "send_failed"\n'
              '        trace_payload["send_error"] = telegram_publisher._sanitize(str(send_exc))\n'
              '        _emit_interactive_trace(trace_payload, critical=True)\n'
              '        observability_logger.log_error({\n'
              '            "event_type": "error",\n'
              '            "data": {\n'
              '                "severity": "ERROR",\n'
              '                "error_type": "telegram_app_nav_send_failure",\n'
              '                "message": telegram_publisher._sanitize(str(send_exc)),\n'
              '                "context": {\n'
              '                    "chat_id": chat_id,\n'
              '                    "user_id": user_id,\n'
              '                    "thread_id": thread_id,\n'
              '                    "session_key_fingerprint": trace_payload.get("session_key_fingerprint"),\n'
              '                },\n'
              '            },\n'
              '        })\n\n'
              '        # Make a keyboard/payload rejection visible without widening access.\n'
              '        try:\n'
              '            fallback_result = telegram_publisher.send_message(\n'
              '                chat_id=chat_id,\n'
              '                text=(\n'
              '                    "Telegram request reached the runtime, but the interactive "\n'
              '                    "response could not be rendered. The failure was logged."\n'
              '                ),\n'
              '                reply_markup=None,\n'
              '                thread_id=thread_id,\n'
              '            )\n'
              '            trace_payload["selected_operation"] = "send_text_fallback"\n'
              '            trace_payload["text_fallback_result"] = "sent"\n'
              '            if isinstance(fallback_result, dict):\n'
              '                fallback_message = fallback_result.get("result") or {}\n'
              '                fallback_message_id = fallback_message.get("message_id")\n'
              '                if fallback_message_id:\n'
              '                    telegram_app_nav.set_active_message(\n'
              '                        user_id=user_id,\n'
              '                        chat_id=chat_id,\n'
              '                        message_id=fallback_message_id,\n'
              '                        thread_id=thread_id,\n'
              '                    )\n'
              '            _emit_interactive_trace(trace_payload, critical=True)\n'
              '        except Exception as fallback_exc:\n'
              '            observability_logger.log_error({\n'
              '                "event_type": "error",\n'
              '                "data": {\n'
              '                    "severity": "ERROR",\n'
              '                    "error_type": "telegram_app_nav_text_fallback_failure",\n'
              '                    "message": telegram_publisher._sanitize(str(fallback_exc)),\n'
              '                    "context": {\n'
              '                        "chat_id": chat_id,\n'
              '                        "user_id": user_id,\n'
              '                        "thread_id": thread_id,\n'
              '                    },\n'
              '                },\n'
              '            })\n'
          )
          if old not in text:
              raise SystemExit('send-failure anchor not found')
          text = text.replace(old, new, 1)

          old = (
              '    except Exception as e:\n'
              '        observability_logger.log_error({\n'
              '            "event_type": "error",\n'
              '            "data": {\n'
              '                "severity": "ERROR",\n'
              '                "error_type": "bot_service_exception",\n'
              '                "message": str(e),\n'
              '            },\n'
              '        })\n'
          )
          new = (
              '    except Exception as e:\n'
              '        observability_logger.log_error({\n'
              '            "event_type": "error",\n'
              '            "data": {\n'
              '                "severity": "ERROR",\n'
              '                "error_type": "bot_service_exception",\n'
              '                "message": telegram_publisher._sanitize(str(e)),\n'
              '            },\n'
              '        })\n\n'
              '        # Authorized Admin requests must not disappear silently when an\n'
              '        # internal renderer/navigation failure occurs. Re-check context\n'
              '        # fail-closed and emit only a sanitized transport fallback.\n'
              '        try:\n'
              '            failed_cmd = (\n'
              '                text.split()[0].split("@", 1)[0].lower()\n'
              '                if isinstance(text, str) and text.startswith("/")\n'
              '                else ""\n'
              '            )\n'
              '            if (\n'
              '                msg\n'
              '                and failed_cmd in admin_command_names()\n'
              '                and _can_run_admin_command(msg, user_id, failed_cmd)\n'
              '            ):\n'
              '                target = reply_target_from_message(msg)\n'
              '                if target is not None:\n'
              '                    telegram_publisher.send_message(\n'
              '                        chat_id=target.chat_id,\n'
              '                        text=(\n'
              '                            "Admin request reached the runtime but could not be "\n'
              '                            "completed safely. The failure was logged."\n'
              '                        ),\n'
              '                        reply_markup=None,\n'
              '                        thread_id=target.thread_id,\n'
              '                    )\n'
              '        except Exception as fallback_exc:\n'
              '            observability_logger.log_error({\n'
              '                "event_type": "error",\n'
              '                "data": {\n'
              '                    "severity": "ERROR",\n'
              '                    "error_type": "bot_service_exception_fallback_failed",\n'
              '                    "message": telegram_publisher._sanitize(str(fallback_exc)),\n'
              '                },\n'
              '            })\n'
          )
          if old not in text:
              raise SystemExit('global-exception anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile patched module
        run: python -m py_compile send/core/bot_service.py

      - name: Run focused regression tests
        run: |
          python -m pytest -q tests/canonical/unit/test_r017_admin_delivery_failsafe.py tests/telegram_transport/test_telegram_transport_and_recovery.py

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r017_hotfix_apply.yml
          git add send/core/bot_service.py tests/canonical/unit/test_r017_admin_delivery_failsafe.py
          git commit -m "fix: make R-017 admin delivery fail-safe"
          git push origin HEAD:hotfix/r017-admin-delivery-failsafe
