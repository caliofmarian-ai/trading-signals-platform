name: Signals App Targeted CI

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "apps/signals_app/**"
      - ".github/workflows/signals-app-tests.yml"

permissions:
  contents: read

concurrency:
  group: signals-app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact app change
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and test dependencies
        run: python -m pip install -r requirements.txt -r apps/signals_app/requirements.txt pytest httpx
      - name: Run app API, storage and owner-inbox tests
        run: python -m pytest -q apps/signals_app/tests
