name: Twelve Data Direct Test Capture

on:
  push:
    branches:
      - feature/twelvedata-live-stream-foundation

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twelvedata-live-stream-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run and capture
        shell: bash
        run: |
          set +e
          PYTHONPATH=send pytest -q tests/canonical/unit/test_twelvedata_live_stream.py tests/canonical/unit/test_finnhub_market_data_foundation.py tests/canonical/unit/test_telegram_runtime_remediation.py tests/canonical/integration/test_live_distribution_v3.py > TWELVEDATA_TEST_OUTPUT.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> TWELVEDATA_TEST_OUTPUT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TWELVEDATA_TEST_OUTPUT.txt
          git commit -m "[skip ci] Capture Twelve Data test output" || true
          git push origin HEAD:feature/twelvedata-live-stream-foundation
          exit 0
