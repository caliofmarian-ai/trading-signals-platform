name: R-013 Apply Provider-State Reconciliation

on:
  push:
    branches:
      - remediation/audit-2026-09-01-r013-provider-state-corruption

permissions:
  contents: write

jobs:
  apply-r013:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Apply R-013 control-plane patch
        run: |
          python scripts/r013_apply_patch.py
          python -m py_compile send/core/market_data_provider_control.py send/core/admin_commands.py send/core/telegram_admin_ui.py
          git diff --check

      - name: Focused R-013 validation
        run: |
          python -m pytest -q tests/canonical/unit/test_r013_provider_state_corruption.py
          python -m pytest -q tests/canonical/unit/test_market_data_provider_control.py
          PYTHONPATH=send python -m pytest -q tests/canonical/unit/test_startup_preflight.py
          python -m pytest -q tests/telegram_admin_ui_restoration/test_admin_ui_restoration.py
          PYTHONPATH=send python -m pytest -q tests/telegram_app/test_real_navigation.py

      - name: Commit reconciled implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add send/core/admin_commands.py send/core/telegram_admin_ui.py audit/repository-wide-audit-2026-09-01/REMEDIATION_MASTER_PLAN.md
          git commit -m "R-013 reconcile provider-state control plane"
          git push origin HEAD:remediation/audit-2026-09-01-r013-provider-state-corruption
