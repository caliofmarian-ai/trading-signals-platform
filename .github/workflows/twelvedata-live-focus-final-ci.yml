name: Twelve Data Live Focus Final CI

on:
  push:
    branches:
      - feature/twelvedata-live-stream-foundation
    paths:
      - .github/workflows/twelvedata-live-focus-final-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twelvedata-live-stream-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Compile modified runtime
        run: PYTHONPATH=.:send python -m py_compile send/core/signal_engine.py send/runtime/market_client.py send/runtime/twelvedata_market_data.py
      - name: Focused validation
        run: |
          PYTHONPATH=.:send pytest -q \
            tests/canonical/unit/test_twelvedata_live_stream.py \
            tests/canonical/unit/test_signal_engine_wide_focus_scheduling_v3.py \
            tests/canonical/unit/test_signal_engine_persistence_boundary_v3.py \
            tests/canonical/unit/test_binary_strategy_v2_runtime.py \
            tests/batch_06/test_fsm_restart_recovery.py \
            tests/canonical/integration/test_live_distribution_v3.py
      - name: Full regression
        run: PYTHONPATH=.:send pytest -q
