name: Active Canon Metadata Cleanup

on:
  push:
    branches:
      - governance/active-canon-metadata-cleanup-20260901

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/active-canon-metadata-cleanup-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit and repair stale promotion metadata
        run: python scripts/_tmp_active_canon_metadata_cleanup.py
      - name: Verify scope and commit deterministic cleanup
        run: |
          git diff --check
          git status --short
          git config user.name 'caliofmarian-ai'
          git config user.email 'caliofmarian@gmail.com'
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No metadata cleanup changes required.'
            exit 0
          fi
          git add send/docs/canonical/active audit/active-canon-metadata-cleanup-20260901/REPORT.md
          git commit -m 'Repair stale active canon promotion metadata'
          git push origin HEAD:governance/active-canon-metadata-cleanup-20260901
