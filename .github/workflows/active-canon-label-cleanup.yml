name: Active Canon Label Cleanup

on:
  push:
    branches:
      - governance/active-canon-metadata-cleanup-20260901

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/active-canon-metadata-cleanup-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact label cleanup
        run: python scripts/_tmp_active_canon_label_cleanup.py
      - name: Commit label cleanup
        run: |
          git status --short
          git config user.name 'caliofmarian-ai'
          git config user.email 'caliofmarian@gmail.com'
          git add send/docs/canonical/active
          git commit -m 'Normalize active canon promotion labels'
          git push origin HEAD:governance/active-canon-metadata-cleanup-20260901
