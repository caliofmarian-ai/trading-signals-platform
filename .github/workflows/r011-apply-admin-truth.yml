name: R-011 Apply Admin Truth Patch

on:
  push:
    branches:
      - remediation/audit-2026-09-01-r011-free-entitlement

permissions:
  contents: write

jobs:
  apply-r011:
    if: contains(github.event.head_commit.message, 'R-011 apply admin truth patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded R-011 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          admin_path = repo / 'send/core/admin_views.py'
          text = admin_path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"def render_distribution_panel\(.*?\n\ndef render_intelligence_panel\(",
              re.S,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one render_distribution_panel block, found {len(matches)}')

          replacement = '''def render_distribution_panel(
              admin_chat_id: int,
              admin_thread_id: int,
              routes: Optional[List[str]] = None,
          ) -> str:
              """Render effective governed distribution truth for authorized admins.

              R-011 keeps the panel read-only and sources values from the same live
              distribution configuration/state used by routing. Display values are
              never hardcoded. Environment overrides remain supported, but their
              source is made explicit so the effective entitlement is auditable.
              """
              import os
              from core import distribution_router as legacy_distribution
              from core import distribution_router_v3 as live_distribution

              lines: List[str] = ["Distribution Control", "", "Route Status"]

              try:
                  cfg = live_distribution._load_effective_config()
                  state = legacy_distribution.load_state()
                  raw = legacy_distribution._load_channel_config_file()
              except Exception:
                  lines.append("Configuration: UNAVAILABLE (effective distribution truth could not be read).")
                  return _lines(lines)

              raw = raw if isinstance(raw, dict) else {}
              raw_limits = raw.get("limits") if isinstance(raw.get("limits"), dict) else {}
              raw_routes = raw.get("routes") if isinstance(raw.get("routes"), dict) else {}
              limits = cfg.get("limits") if isinstance(cfg.get("limits"), dict) else {}
              channels = cfg.get("channels") if isinstance(cfg.get("channels"), dict) else {}
              enabled = cfg.get("enabled") if isinstance(cfg.get("enabled"), dict) else {}
              tier_state = state.get("tier_state") if isinstance(state, dict) and isinstance(state.get("tier_state"), dict) else {}
              counters = state.get("open_signals_today") if isinstance(state, dict) and isinstance(state.get("open_signals_today"), dict) else {}

              def _limit_source(tier: str) -> str:
                  if str(os.getenv(f"{tier}_LIMIT") or "").strip():
                      return "ENV"
                  if f"{tier}_LIMIT" in raw or tier in raw_limits:
                      return "PERSISTED_CONFIG"
                  route_cfg = raw_routes.get(tier)
                  if isinstance(route_cfg, dict) and "daily_open_now_limit" in route_cfg:
                      return "PERSISTED_CONFIG"
                  return "CANONICAL_DEFAULT"

              for tier in ("FREE", "BASIC", "PRO", "ELITE"):
                  route_enabled = bool(enabled.get(tier, True))
                  mapped = channels.get(tier) not in (None, "", 0)
                  mapping_state = "READY" if route_enabled and mapped else "NOT READY"
                  observed_state = str(tier_state.get(tier) or "ACTIVE").upper()
                  effective_state = observed_state if route_enabled and mapped else "DISABLED"
                  counter = counters.get(tier, 0)
                  limit = limits.get(tier)
                  limit_text = "UNLIMITED" if limit is None else str(limit)
                  counter_text = str(counter) if limit is not None else "unlimited"
                  lines.append(
                      f"{tier}: {effective_state} | {counter_text}/{limit_text} | "
                      f"mapping {mapping_state} | limit source {_limit_source(tier)}"
                  )

              reset = cfg.get("reset") if isinstance(cfg.get("reset"), dict) else {}
              timezone_name = str(reset.get("timezone") or legacy_distribution.DEFAULT_RESET_TZ)
              hour = int(reset.get("hour", 8))
              minute = int(reset.get("minute", 10))
              lines.extend(["", f"Reset reference: {hour:02d}:{minute:02d} {timezone_name}"])

              if admin_chat_id and admin_chat_id != 0:
                  lines.append(f"Admin control chat: {admin_chat_id}")
                  if admin_thread_id:
                      lines.append(f"Admin thread: {admin_thread_id}")
              else:
                  lines.append("Admin control chat: not configured")

              if routes:
                  lines.extend(["", "Configured Routes:"])
                  lines.extend(f"- {route}" for route in routes)

              lines.extend([
                  "",
                  "Publication Controls",
                  "Read-only effective configuration view. No distribution mutation is performed here.",
              ])
              return _lines(lines)


          def render_intelligence_panel('''

          text = pattern.sub(replacement, text, count=1)
          admin_path.write_text(text, encoding='utf-8')

          test_path = repo / 'tests/canonical/unit/test_r011_free_entitlement_reconciliation.py'
          test_path.write_text('''from __future__ import annotations

import json
import sys
from pathlib import Path

import pytest


REPO_ROOT = Path(__file__).resolve().parents[3]
SEND_ROOT = REPO_ROOT / "send"
if str(SEND_ROOT) not in sys.path:
    sys.path.insert(0, str(SEND_ROOT))

from core import admin_views
from core import distribution_router
from core import distribution_router_v3


def test_repository_free_baseline_is_canonical_six() -> None:
    env_lines = (REPO_ROOT / ".env.example").read_text(encoding="utf-8").splitlines()
    free_env = [line for line in env_lines if line.startswith("FREE_LIMIT=")]
    assert free_env == ["FREE_LIMIT=6"]

    channel_cfg = json.loads((SEND_ROOT / "config/channel_config.json").read_text(encoding="utf-8"))
    assert channel_cfg["FREE_LIMIT"] == 6
    assert distribution_router.DEFAULT_LIMITS["FREE"] == 6
    assert distribution_router_v3.DEFAULT_LIMITS["FREE"] == 6


def _effective_cfg(free_limit: int) -> dict:
    return {
        "channels": {"FREE": 1001, "BASIC": 1002, "PRO": 1003, "ELITE": 1004},
        "limits": {"FREE": free_limit, "BASIC": 20, "PRO": 50, "ELITE": None},
        "enabled": {"FREE": True, "BASIC": True, "PRO": True, "ELITE": True},
        "feedback_capable": {"FREE": False, "BASIC": False, "PRO": False, "ELITE": True},
        "reset": {"timezone": "Europe/London", "hour": 8, "minute": 10},
        "admin": {},
    }


def _state() -> dict:
    return {
        "tier_state": {"FREE": "ACTIVE", "BASIC": "ACTIVE", "PRO": "ACTIVE", "ELITE": "ACTIVE"},
        "open_signals_today": {"FREE": 2, "BASIC": 3, "PRO": 4, "ELITE": 0},
    }


def test_distribution_admin_view_shows_persisted_effective_free_limit(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    monkeypatch.delenv("FREE_LIMIT", raising=False)
    monkeypatch.setattr(distribution_router_v3, "_load_effective_config", lambda: _effective_cfg(6))
    monkeypatch.setattr(distribution_router, "load_state", _state)
    monkeypatch.setattr(distribution_router, "_load_channel_config_file", lambda: {"FREE_LIMIT": 6})

    rendered = admin_views.render_distribution_panel(123, 0)

    assert "FREE: ACTIVE | 2/6 | mapping READY | limit source PERSISTED_CONFIG" in rendered
    assert "Reset reference: 08:10 Europe/London" in rendered


def test_distribution_admin_view_exposes_governed_env_override_source(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    monkeypatch.setenv("FREE_LIMIT", "9")
    monkeypatch.setattr(distribution_router_v3, "_load_effective_config", lambda: _effective_cfg(9))
    monkeypatch.setattr(distribution_router, "load_state", _state)
    monkeypatch.setattr(distribution_router, "_load_channel_config_file", lambda: {"FREE_LIMIT": 6})

    rendered = admin_views.render_distribution_panel(123, 0)

    assert "FREE: ACTIVE | 2/9 | mapping READY | limit source ENV" in rendered
    assert "2/6" not in rendered


def test_distribution_admin_view_fails_visibly_when_truth_is_unavailable(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    def _boom() -> dict:
        raise RuntimeError("unavailable")

    monkeypatch.setattr(distribution_router_v3, "_load_effective_config", _boom)
    rendered = admin_views.render_distribution_panel(123, 0)
    assert "Configuration: UNAVAILABLE" in rendered
    assert "ACTIVE |" not in rendered
''', encoding='utf-8')

          decision_path = repo / 'audit/repository-wide-audit-2026-09-01/R011_FREE_ENTITLEMENT_RECONCILIATION.md'
          decision_path.write_text('''# R-011 — FREE Entitlement Limit Reconciliation

Status: IMPLEMENTED ON REMEDIATION BRANCH — VALIDATION PENDING
Issue: #118
Parent: #97
Base main commit: `e42abad1ebec47f075eee8f7de78f8085bdc4732`

## Canonical decision

The governed FREE baseline is 6 successful `OPEN_NOW` publications per reset window. BASIC remains 20, PRO remains 50, and ELITE remains unlimited.

The existing runtime configuration precedence is preserved: an explicit environment value may override persisted configuration; persisted configuration may override the canonical runtime default. R-011 does not remove this governed configuration capability. Instead, it removes stale repository baselines and makes the effective source visible to authorized operators.

## Reconciliation

- `.env.example`: FREE baseline 5 -> 6.
- `send/config/channel_config.json`: FREE baseline 5 -> 6.
- live legacy and v3 runtime defaults remain 6.
- Telegram Distribution Control now reads the effective live distribution config/state rather than presenting a placeholder configuration summary.
- each route exposes effective state, current counter/limit, mapping readiness, and limit source (`ENV`, `PERSISTED_CONFIG`, or `CANONICAL_DEFAULT`).
- unavailable config/state fails visibly rather than claiming health.

## Scope boundary

No strategy threshold, TPS, S/R rule, provider selection, Finnhub licensing guard, FSM lifecycle, Execution Time behavior, publication counting semantic, or broker execution setting is changed by R-011.
''', encoding='utf-8')

          plan_path = repo / 'audit/repository-wide-audit-2026-09-01/REMEDIATION_MASTER_PLAN.md'
          plan = plan_path.read_text(encoding='utf-8')
          old_r010 = '''### R-010 — Model Time boundary/sawtooth review
Severity: HIGH
Status: IN PROGRESS
Issue: #116
PR: #117 (Draft until final audit completion)
Depends on: R-001 — SATISFIED; execution sequence through R-009 — SATISFIED
Current validation: 1041 full-suite tests passed; provider selector 5 passed; Telegram admin regression 72 passed; GitHub Actions run 33605761955 SUCCESS.
'''
          new_r010 = '''### R-010 — Model Time boundary/sawtooth review
Severity: HIGH
Status: CLOSED
Issue: #116 — CLOSED
PR: #117
Merged main commit: `e42abad1ebec47f075eee8f7de78f8085bdc4732`
Depends on: R-001 — SATISFIED; execution sequence through R-009 — SATISFIED
Validation: 1041 full-suite tests passed; provider selector 5 passed; Telegram admin regression 72 passed; PR final GitHub Actions validation SUCCESS.
'''
          if old_r010 not in plan:
              raise SystemExit('R-010 master-plan status block did not match expected pre-R-011 state')
          plan = plan.replace(old_r010, new_r010, 1)

          old_r011 = '''### R-011 — FREE entitlement limit reconciliation
Severity: HIGH
Status: PENDING

Required outcome:
'''
          new_r011 = '''### R-011 — FREE entitlement limit reconciliation
Severity: HIGH
Status: IN PROGRESS
Issue: #118
Branch: `remediation/audit-2026-09-01-r011-free-entitlement`
Depends on: R-010 — SATISFIED

Required outcome:
'''
          if old_r011 not in plan:
              raise SystemExit('R-011 master-plan block did not match expected pending state')
          plan_path.write_text(plan.replace(old_r011, new_r011, 1), encoding='utf-8')
          PY

      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add send/core/admin_views.py tests/canonical/unit/test_r011_free_entitlement_reconciliation.py audit/repository-wide-audit-2026-09-01/R011_FREE_ENTITLEMENT_RECONCILIATION.md audit/repository-wide-audit-2026-09-01/REMEDIATION_MASTER_PLAN.md
          git diff --cached --check
          git commit -m "R-011 expose effective entitlement truth in admin"
          git push origin HEAD:remediation/audit-2026-09-01-r011-free-entitlement
