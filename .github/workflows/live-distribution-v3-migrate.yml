name: Live Distribution V3 Migration
on:
  push:
    branches: [feature/live-distribution-telegram-v3]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-distribution-telegram-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_tmp_live_distribution_v3_migrate.py
      - run: |
          python -m py_compile send/core/distribution_router_v3.py send/core/distribution_router.py send/core/observability_logger.py send/core/outcome_service.py send/core/signal_execution_gate.py send/core/signal_engine.py send/state_store/state_store.py
      - run: |
          git config user.name 'caliofmarian-ai'
          git config user.email 'caliofmarian@gmail.com'
          git add -A
          git commit -m 'Connect canonical v3 live distribution runtime'
          git push origin HEAD:feature/live-distribution-telegram-v3
