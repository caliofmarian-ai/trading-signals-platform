name: R-014 Apply Master Plan and Validate

on:
  push:
    branches:
      - remediation/audit-2026-09-01-r014-strategy-catalog-authority

permissions:
  contents: write

jobs:
  reconcile-r014:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Patch remediation master plan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('audit/repository-wide-audit-2026-09-01/REMEDIATION_MASTER_PLAN.md')
          text = path.read_text(encoding='utf-8')
          old = '''### R-013 — Provider-state corruption fail-closed behavior
          Severity: HIGH
          Status: IN PROGRESS
          Issue: #122
          Branch: `remediation/audit-2026-09-01-r013-provider-state-corruption`
          Depends on: R-012 — SATISFIED

          Required outcome:
          - corrupt persisted provider state produces an explicit blocked/degraded state instead of silently selecting another provider;
          - owner selection remains authoritative;
          - one provider only.

          ### R-014 — Strategy catalog / Owner UI authority reconciliation
          Severity: HIGH
          Status: PENDING
          '''
          new = '''### R-013 — Provider-state corruption fail-closed behavior
          Severity: HIGH
          Status: CLOSED
          Issue: #122 — CLOSED
          PR: #123
          Merged main commit: `f37694b640071af4273134b506dda660345ad991`
          Depends on: R-012 — SATISFIED
          Validation: provider selector 5 passed; Telegram admin regression 72 passed; full repository suite 1060 passed.

          Required outcome:
          - corrupt persisted provider state produces an explicit blocked/degraded state instead of silently selecting another provider;
          - owner selection remains authoritative;
          - one provider only.

          ### R-014 — Strategy catalog / Owner UI authority reconciliation
          Severity: HIGH
          Status: IN PROGRESS
          Issue: #124
          Branch: `remediation/audit-2026-09-01-r014-strategy-catalog-authority`
          Depends on: R-013 — SATISFIED
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one R-013/R-014 master-plan block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile send/core/strategy_catalog.py
          git diff --check

      - name: Focused R-014 validation
        run: |
          PYTHONPATH=send python -m pytest -q tests/telegram_app/test_strategy_choice_page.py
          PYTHONPATH=send python -m pytest -q tests/telegram_app/test_owner_knowledge_layer.py
          python -m pytest -q tests/telegram_admin_ui_restoration/test_admin_ui_restoration.py
          PYTHONPATH=send python -m pytest -q tests/telegram_app/test_real_navigation.py

      - name: Commit master-plan reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/repository-wide-audit-2026-09-01/REMEDIATION_MASTER_PLAN.md
          git commit -m "R-014 update remediation master plan"
          git push origin HEAD:remediation/audit-2026-09-01-r014-strategy-catalog-authority
