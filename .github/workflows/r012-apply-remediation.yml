name: R-012 Apply Strategy Profile Reconciliation

on:
  push:
    branches:
      - remediation/audit-2026-09-01-r012-strategy-profiles

permissions:
  contents: write

jobs:
  apply-r012:
    if: contains(github.event.head_commit.message, 'R-012 apply remediation patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Apply fail-closed profile reconciliation
        run: |
          python scripts/r012_apply_patch.py
          python scripts/r012_fix_generated_bot.py
          python scripts/r012_patch_real_nav_tests.py
          python -m py_compile send/core/admin_commands.py send/core/telegram_admin_ui.py send/core/bot_service.py
          git diff --check

      - name: Focused R-012 validation
        run: |
          python -m pytest -q tests/canonical/unit/test_r012_strategy_profile_reconciliation.py
          python -m pytest -q tests/telegram_admin_ui_restoration/test_admin_ui_restoration.py
          PYTHONPATH=send python -m pytest -q tests/telegram_app/test_real_navigation.py

      - name: Commit reconciled implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add send/core/admin_commands.py send/core/telegram_admin_ui.py send/core/bot_service.py tests/telegram_admin_ui_restoration/test_admin_ui_restoration.py tests/telegram_app/test_real_navigation.py tests/canonical/unit/test_r012_strategy_profile_reconciliation.py audit/repository-wide-audit-2026-09-01/R012_STRATEGY_PROFILE_RECONCILIATION.md audit/repository-wide-audit-2026-09-01/REMEDIATION_MASTER_PLAN.md
          git commit -m "R-012 disable non-canonical strategy profiles"
          git push origin HEAD:remediation/audit-2026-09-01-r012-strategy-profiles
