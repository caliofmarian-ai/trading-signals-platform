name: R015 Master Plan Sync

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'remediation/audit-2026-09-01-r015-env-example-reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Update remediation pointer and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('audit/repository-wide-audit-2026-09-01/REMEDIATION_MASTER_PLAN.md')
          text = path.read_text(encoding='utf-8')
          old = '''### R-014 — Strategy catalog / Owner UI authority reconciliation
          Severity: HIGH
          Status: IN PROGRESS
          Issue: #124
          Branch: `remediation/audit-2026-09-01-r014-strategy-catalog-authority`
          Depends on: R-013 — SATISFIED

          Required outcome:
          - strategy catalog and Owner surfaces point to the active canonical strategy authority (`ALGO_SPEC_v3.0.0` where applicable) and accurate implementation/version terminology.

          ### R-015 — Environment/config example reconciliation
          Severity: MEDIUM-HIGH
          Status: PENDING

          Required outcome:
          - `.env.example` reflects current provider bootstrap policy, event schema v3, FREE limit 6, runtime paths, and current safety defaults;
          - example values cannot silently downgrade live semantics.
          '''
          new = '''### R-014 — Strategy catalog / Owner UI authority reconciliation
          Severity: HIGH
          Status: CLOSED
          Issue: #124 — CLOSED
          PR: #125
          Merged main commit: `a50842c22fb4f534da980cbb017172f6f6493427`
          Depends on: R-013 — SATISFIED
          Validation: provider selector 5 passed; Telegram admin regression 72 passed; full repository suite 1061 passed.

          Required outcome:
          - strategy catalog and Owner surfaces point to the active canonical strategy authority (`ALGO_SPEC_v3.0.0` where applicable) and accurate implementation/version terminology.

          ### R-015 — Environment/config example reconciliation
          Severity: MEDIUM-HIGH
          Status: IN PROGRESS
          Issue: #126
          Branch: `remediation/audit-2026-09-01-r015-env-example-reconciliation`
          Depends on: R-014 — SATISFIED

          Required outcome:
          - `.env.example` reflects current provider bootstrap policy, event schema v3, FREE limit 6, runtime paths, and current safety defaults;
          - example values cannot silently downgrade live semantics.
          '''
          # Dedent indentation introduced by the YAML block while retaining file text.
          import textwrap
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one R-014/R-015 block, found {text.count(old)}')
          text = text.replace(old, new)
          progress = (
              '\n- 2026-09-02: R-014 merged through PR #125; main advanced to '
              '`a50842c22fb4f534da980cbb017172f6f6493427`; Issue #124 closed; '
              'final validation was provider selector 5 passed, Telegram admin regression 72 passed, '
              'full repository suite 1061 passed.\n'
              '- 2026-09-02: R-015 started on branch '
              '`remediation/audit-2026-09-01-r015-env-example-reconciliation`; Issue #126 and Draft PR #127 created.\n'
          )
          if 'R-015 started on branch `remediation/audit-2026-09-01-r015-env-example-reconciliation`' not in text:
              text = text.rstrip() + progress
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/r015-master-plan-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/repository-wide-audit-2026-09-01/REMEDIATION_MASTER_PLAN.md .github/workflows/r015-master-plan-sync.yml
          git commit -m "R-015: advance remediation master plan"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
